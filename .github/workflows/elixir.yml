# separate terms of service, privacy policy, and support
# documentation.

name: Elixir CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    name: Build and test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Elixir
      # v1 (not the old v1.16.0 SHA) so it supports current Elixir/OTP + ubuntu-24.
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.19' # match the repo's formatter (CI was stale at 1.15)
        otp-version: '27'
    - name: Restore dependencies cache
      uses: actions/cache@v3
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: Install dependencies
      run: mix deps.get
    - name: Run checks (format, compile --warnings-as-errors, credo --strict, coverage)
      run: mix check
    - name: Restore Dialyzer PLT cache
      uses: actions/cache@v3
      with:
        path: priv/plts
        key: ${{ runner.os }}-plt-elixir1.19-otp27-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-plt-elixir1.19-otp27-
    - name: Dialyzer
      run: mix dialyzer
